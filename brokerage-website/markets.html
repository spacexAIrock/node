<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markets — Northline</title>
    <meta name="description" content="Browse and trade demo stocks and ETFs on Northline." />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="site-nav is-scrolled" aria-label="Primary">
      <a class="nav-brand" href="index.html">
        <span class="mark" aria-hidden="true"></span>
        Northline
      </a>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html#approach">Approach</a></li>
        <li><a href="markets.html" aria-current="page">Markets</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li>
          <a class="nav-cta" href="portfolio.html">Open account</a>
        </li>
      </ul>
    </nav>

    <header class="page-hero">
      <h1>Markets</h1>
      <p>Search symbols, watch the day move, and place a demo trade.</p>
    </header>

    <section class="section" style="padding-top: 2rem">
      <div class="section-inner">
        <div class="markets-toolbar">
          <input
            class="search-input"
            type="search"
            id="market-search"
            placeholder="Search symbol or name…"
            autocomplete="off"
          />
          <button class="btn btn-dark" type="button" id="refresh-quotes">Refresh quotes</button>
        </div>
        <div class="panel table-wrap">
          <table class="markets">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Name</th>
                <th>Price</th>
                <th>Change</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="markets-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div><strong>Northline</strong> · Markets</div>
      <div>© 2026 Northline Demo</div>
      <p class="disclaimer">
        Simulated prices for demonstration. Not real-time market data.
      </p>
    </footer>

    <div class="modal-backdrop" id="trade-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-labelledby="trade-title">
        <h2 id="trade-title">Trade</h2>
        <p class="sub" id="trade-sub"></p>
        <form id="trade-form">
          <div class="field">
            <label for="trade-side">Side</label>
            <select id="trade-side" name="side">
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
          </div>
          <div class="field">
            <label for="trade-qty">Shares</label>
            <input id="trade-qty" name="qty" type="number" min="1" step="1" value="10" required />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="trade-cancel" style="color: var(--ink); border-color: var(--line)">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Place order</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js"></script>
  </body>
</html>
